[tool:pytest]
minversion = 6.0
addopts = -ra -q --tb=short --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    performance: Performance and scalability tests
    slow: Tests that take longer than 30 seconds
    data: Tests requiring market data
    mock: Tests using mocked dependencies
    edge_case: Edge case and error handling tests
    regression: Regression tests for bug fixes
    data_management: Data Management tests
    strategy_parameters: Strategy Parameters tests
    trading_logic: Trading Logic tests
    ui: User interface tests
    transaction_costs: Transaction Costs tests
    performance_analytics: Performance Analytics tests
    edge_cases: Edge Cases tests
    compliance: Regulatory compliance tests
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S